<!-- Note Taker: open this page to run (no server needed). -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Note Taker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header class="app__header">
        <h1>📝 Note Tender</h1>
        <button id="newNoteBtn" class="btn btn--primary">+ New Note</button>
      </header>
      <main id="noteList" class="note-list">
        <p class="empty">No notes yet. Click “New Note” to create your first note.</p>
      </main>
    </div>
    <script src="app.js" />
  </body>
</html>
